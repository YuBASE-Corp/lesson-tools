<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配列・オブジェクトゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/languages/javascript.min.js"></script>
    <style>
        .highlight {
            background-color: #fef08a;
            font-weight: 600;
            padding: 0.25rem;
            display: inline-block;
        }
        pre {
            white-space: pre-wrap;
        }
        pre code {
            font-size: 0.75rem;
        }
        #answer:empty:before {
            content: attr(data-placeholder);
            color: #64748b;
        }
        #answer:focus {
            outline: 2px solid #0f172a;
            outline-offset: 2px;
        }
        #demo-content button {
            background-color: #0f172a;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }
        #demo-content button:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body class="bg-white text-slate-900 antialiased">
    <div class="min-h-screen">
        <div class="max-w-7xl mx-auto px-8 py-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-8">配列・オブジェクトゲーム</h1>
            
            <div class="grid grid-cols-3 gap-6">
                <!-- 左サイドバー -->
                <div class="col-span-1">
                    <!-- モード選択とボタン -->
                    <div class="mb-6">
                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-6 mb-4">
                            <label for="mode" class="block text-sm font-medium text-slate-700 mb-3">モードを選択</label>
                            <select id="mode" class="w-full p-2 border border-slate-200 rounded-md bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 mb-4">
                                <option value="array">配列モード</option>
                                <option value="object">オブジェクトモード</option>
                                <option value="mixed" selected>配列&オブジェクトモード</option>
                            </select>
                            <div class="flex gap-2">
                                <button id="singleQuestionButton" onclick="startGame()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-md text-sm transition-colors">
                                    単問出題
                                </button>
                                <button id="timeAttackButton" onclick="startTimeAttack()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-md text-sm transition-colors">
                                    タイムアタック
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- タイマー -->
                    <div class="mb-6">
                        <div id="timer" class="text-xl font-semibold text-slate-900"></div>
                    </div>

                    <!-- 使い方 -->
                    <div class="mb-6">
                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-6">
                            <h2 class="text-lg font-semibold text-slate-900 mb-4">使い方</h2>
                            <ol class="list-decimal list-outside pl-5 space-y-2 text-sm text-slate-700 leading-relaxed">
                                <li>モードを選択：配列、オブジェクト、または両方</li>
                                <li>「単問出題」または「タイムアタック」を選択</li>
                                <li>表示された問題に対する正しいアクセス方法を入力</li>
                                <li>「送信」ボタンをクリックまたはCtrl+Enter（Mac: Cmd+Enter）で回答</li>
                                <li>タイムアタックモード：60秒間でできるだけ多くの問題に挑戦！</li>
                            </ol>
                            <p class="mt-4 text-xs text-slate-600 italic">ヒント：入力中に候補が表示されます。Tab or Enterキーで選択できます。</p>
                        </div>
                    </div>
                </div>

                <!-- メインコンテンツ -->
                <div class="col-span-2">
                    <!-- 問題表示エリア -->
                    <div class="mb-6">
                        <div id="question" class="bg-slate-50 border border-slate-200 rounded-lg p-6 mb-4 min-h-[200px]"></div>
                        
                        <!-- 結果表示エリア -->
                        <div id="result" class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-sm"></div>
                    </div>

                    <!-- 回答入力エリア -->
                    <div class="mb-6">
                        <div class="flex items-center gap-3">
                            <div id="answer" contenteditable="true" class="flex-grow p-3 border border-slate-200 rounded-md bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2" tabindex="0" data-placeholder="答えを入力.."></div>
                            <button onclick="checkAnswer()" class="bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-6 rounded-md text-sm transition-colors whitespace-nowrap" title="Windows: Ctrl+Enter, Mac: Cmd+Enter でも送信できます">
                                送信
                            </button>
                        </div>
                        
                        <!-- 候補表示エリア -->
                        <div id="suggestions" class="hidden bg-white border border-slate-200 rounded-md shadow-lg mt-2 max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
